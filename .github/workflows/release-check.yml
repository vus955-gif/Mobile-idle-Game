name: Kontrola wydania

# Tylko przed wydaniem: na co dzień DEV_TOOLS = true celowo, więc ta kontrola nie biegnie na PR-ach.
# Uruchamia się po wypchnięciu tagu v* (np. v2.6.0) albo ręcznie: Actions → Kontrola wydania → Run workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: DEV_TOOLS wyłączone w wydaniu
        run: npm run release-check
