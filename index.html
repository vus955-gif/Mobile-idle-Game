<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Krzemowe Imperium</title>
  <meta name="description" content="Relaksująca gra idle/clicker: zbuduj firmę technologiczną od garażu do kosmicznego imperium.">
  <meta name="theme-color" content="#0f1226">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imperium">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="hud-top">
        <button class="company-chip" data-act="goto" data-tab="company" data-sub="settings" aria-label="Firma">
          <span class="company-logo" aria-hidden="true">◆</span>
          <span class="company-text">
            <span id="hud-company" class="company-name">Garażowy Startup</span>
            <span id="hud-stage" class="company-stage">Garaż</span>
          </span>
        </button>
        <div class="hud-chips">
          <button class="chip chip-dev" id="hud-dev-chip" data-act="goto" data-tab="company" data-sub="settings" hidden></button>
          <span class="chip chip-rp" id="hud-rp-chip" hidden><span class="chip-ico">🔬</span><span id="hud-rp">0</span></span>
          <span class="chip chip-inv" id="hud-inv-chip" hidden><span class="chip-ico">💎</span><span id="hud-inv">0</span></span>
          <button class="icon-btn" id="sound-btn" data-act="toggle-sound" aria-label="Dźwięk" data-i18n-aria="sound"></button>
        </div>
      </div>
      <div class="hud-money">
        <div class="cash" id="hud-cash">$0</div>
        <div class="income"><span id="hud-income">$0</span>/s</div>
      </div>
    </header>

    <main id="views">
      <section class="view active" id="view-office" data-view="office">
        <div class="scene-wrap" id="scene-wrap">
          <div id="scene" class="scene"></div>
          <div class="fx-layer" id="fx-layer"></div>
          <div class="bubble-layer" id="bubble-layer"></div>
          <div class="scene-badges" id="scene-badges"></div>
          <div class="layer-bar" id="layer-bar"></div>
          <div class="scene-tools" id="scene-tools">
            <button class="scene-tool" data-act="goto" data-tab="team" data-sub="world" aria-label="Świat" data-i18n-aria="team.world">🌍</button>
            <button class="scene-tool" data-act="zen" aria-label="Tryb zen" data-i18n-aria="zen.enter">🪷</button>
          </div>
        </div>
        <div class="ticker"><div class="ticker-inner" id="ticker"></div></div>
        <div class="office-bottom">
          <div class="office-side office-left" id="office-left"></div>
          <div class="tap-area">
            <button class="tap-btn" id="tap-btn" aria-label="Koduj" data-i18n-aria="tap.label">
              <span class="tap-ring"></span>
              <svg class="tap-icon" viewBox="0 0 64 64" aria-hidden="true">
                <rect x="10" y="14" width="44" height="28" rx="4" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="3"/>
                <path d="M6 46h52l-4 6H10z" fill="#fff"/>
                <path d="M26 23l-6 5 6 5M38 23l6 5-6 5M34 21l-4 14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="tap-label"><span data-i18n="tap.label">Koduj</span> · <span id="click-value">+$1</span></div>
          </div>
          <div class="office-side office-right" id="office-right"></div>
        </div>
      </section>

      <section class="view" id="view-products" data-view="products">
        <div class="view-head">
          <h2 data-i18n="tab.products">Produkty</h2>
          <div class="seg buy-seg" data-seg="buy"></div>
        </div>
        <div class="hint reach-hint" id="products-reach" hidden></div>
        <div class="list" id="products-list"></div>
      </section>

      <section class="view" id="view-team" data-view="team">
        <div class="view-head">
          <h2 data-i18n="tab.team">Zespół</h2>
          <div class="seg buy-seg" data-seg="buy" id="team-buy-seg"></div>
        </div>
        <div class="chips-scroll" id="team-tabs"></div>
        <div class="list" id="team-list"></div>
        <div id="world-body" hidden></div>
      </section>

      <section class="view" id="view-research" data-view="research">
        <div class="view-head">
          <h2 data-i18n="tab.research">Badania</h2>
        </div>
        <div id="research-head"></div>
        <div id="research-list"></div>
      </section>

      <section class="view" id="view-upgrades" data-view="upgrades">
        <div class="view-head">
          <h2 data-i18n="tab.upgrades">Ulepszenia</h2>
          <button class="btn btn-small" id="buy-all-btn" data-act="buy-all" data-i18n="buyAll">Kup wszystkie</button>
        </div>
        <div id="upgrades-list"></div>
      </section>

      <section class="view" id="view-company" data-view="company">
        <div class="view-head">
          <h2 data-i18n="tab.company">Firma</h2>
        </div>
        <div class="chips-scroll" id="company-tabs"></div>
        <div id="company-body"></div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="office"><svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M14 9h5a1 1 0 0 1 1 1v11M3 21h18M7.5 8h3M7.5 12h3M7.5 16h3M17 13v.01M17 17v.01"/></svg><span data-i18n="tab.office">Biuro</span><i class="badge" hidden></i></button>
      <button class="tab" data-tab="products"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5" opacity=".5"/></svg><span data-i18n="tab.products">Produkty</span><i class="badge" hidden></i></button>
      <button class="tab" data-tab="team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.1 4.4 1.9 5 4.6"/></svg><span data-i18n="tab.team">Zespół</span><i class="badge" hidden></i></button>
      <button class="tab" data-tab="research"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7.2 15h9.6"/></svg><span data-i18n="tab.research">Badania</span><i class="badge" hidden></i></button>
      <button class="tab" data-tab="upgrades"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16.5v-9M8 11l4-4 4 4"/></svg><span data-i18n="tab.upgrades">Ulepszenia</span><i class="badge" hidden></i></button>
      <button class="tab" data-tab="company"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 12.5h18"/></svg><span data-i18n="tab.company">Firma</span><i class="badge" hidden></i></button>
    </nav>

    <div class="zen-info" id="zen-info" aria-hidden="true">
      <div class="zen-clock" id="zen-clock"></div>
      <div class="zen-sub" id="zen-sub"></div>
      <div class="zen-hint" data-i18n="zen.exit">Dotknij, żeby wrócić</div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="modal" id="modal" hidden>
      <div class="modal-backdrop" data-act="modal-close"></div>
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-grip"></div>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>
  <noscript><p style="padding:24px;color:#fff">Ta gra potrzebuje włączonego JavaScriptu.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
